# Dependency policy checked by `cargo deny check` (MG-REQ-0125, MG-REQ-1745, MG-REQ-1746).
# Only the owner changes this file (MG-REQ-1723).

[graph]
all-features = true

# MG-REQ-1746.2: security advisories, unmaintained crates and yanked versions fail.
[advisories]
unmaintained = "all"
yanked = "deny"
ignore = [
    # MG-REQ-1746.5: unmaintained notice for `chrono`, not a vulnerability; reached through
    # `arrow` of `duckdb`. Remove when `duckdb` no longer pulls it.
    { id = "RUSTSEC-2026-0543", reason = "Unmaintained notice for chrono, no vulnerability; reached through arrow of duckdb" },
]

# MG-REQ-1745 and MG-REQ-1746.1: only these OSI-approved licenses are allowed. A crate whose
# license cannot be determined fails.
[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "BSL-1.0",
]
confidence-threshold = 0.8
exceptions = [
    # MG-REQ-1746.5: `CC0-1.0` is public domain and is allowed for `tiny-keccak` only; it is
    # reached through `arrow` of `duckdb`. Remove when no dependency needs it.
    { crate = "tiny-keccak", allow = ["CC0-1.0"] },
]
# The list is fixed by MG-REQ-1746.1, so licenses no dependency uses yet are not reported.
unused-allowed-license = "allow"

# The workspace's own crates are not published and are not external dependencies.
[licenses.private]
ignore = true

# MG-REQ-1746.4: wildcard version requirements fail. Duplicate versions only warn.
[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

# MG-REQ-1746.3: crates.io is the only allowed source.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
