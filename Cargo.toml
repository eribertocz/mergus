[workspace]
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97.0"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
# MG-REQ-0170: no `unsafe` by default. Every crate except the FFI ones also sets
# `#![forbid(unsafe_code)]`, which `cargo xtask unsafe` verifies.
unsafe_code = "deny"
# MG-REQ-0175: every public item is documented.
missing_docs = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
# MG-REQ-0009 and MG-REQ-0171: no panics in library code.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
# MG-REQ-0172: logs go through `tracing`, never to standard output or error.
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
# MG-REQ-0175: documentation states errors and panics.
missing_errors_doc = "deny"
missing_panics_doc = "deny"
# MG-REQ-0171: `anyhow` is banned outside `mergus-cli` and `xtask` (see `clippy.toml`).
disallowed_types = "deny"
disallowed_macros = "deny"

# MG-REQ-0194: `libduckdb-sys` defines `DEBUG` for the bundled DuckDB whenever debuginfo is on,
# and `NDEBUG` otherwise. The signed extensions from `extensions.duckdb.org` are release
# (`NDEBUG`) builds, and once attached, a `DEBUG` DuckDB aborts on its own allocator check
# (`allocation_count == 0`) when the database closes. Without debuginfo for this one package,
# the bundled DuckDB is built as the extensions are. Every other crate keeps its debuginfo
# and its `debug_assertions`.
[profile.dev.package.libduckdb-sys]
debug = false
