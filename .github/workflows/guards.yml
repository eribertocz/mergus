# The guards that judge a pull request (MG-REQ-1724).
#
# Every guard runs the scripts and reads the configuration of the pull request's base commit
# (MG-REQ-1722). The head is only data: the API guards read it through the GitHub API, and
# `deny-rules` reads a checkout of it that nothing builds or runs. Checks of the tree alone,
# such as `spec-check` and `language`, run in `cargo xtask ci` instead (MG-REQ-1724).
name: guards

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  issues: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: never

jobs:
  api:
    # The guards that read the pull request through the API, one job each, named after it.
    name: ${{ matrix.guard }}
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        guard:
          - scope
          - session-identity
          - issue-format
          - pr-format
          - commit-format
          - repository-settings
    steps:
      - name: Check out the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Install the toolchain of the base commit
        run: rustup toolchain install
      - name: Run the guard
        run: cargo xtask "$GUARD"
        env:
          GUARD: ${{ matrix.guard }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Run the contract-compatibility guard
        # It blocks through the `scope` check, so it needs no required check of its own
        # (MG-REQ-1724). The step runs even when the scope guard fails, so both report.
        if: matrix.guard == 'scope' && !cancelled()
        run: cargo xtask contract-compatibility
        env:
          GITHUB_TOKEN: ${{ github.token }}

  independent-review:
    name: independent-review
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Install the toolchain of the base commit
        run: rustup toolchain install
      - name: Run the guard
        run: cargo xtask independent-review
        env:
          GITHUB_TOKEN: ${{ github.token }}

  independent-review-rerun:
    # The verdict is a comment. A run started by `issue_comment` attaches its checks to the
    # default branch, so this job re-runs the `independent-review` job of the pull request's
    # head instead; the guard reads the comments again when it re-runs. GitHub re-runs a job
    # only once its whole run has completed, so the job first waits for that, for at most
    # `WAIT_SECONDS`, which stays below the job's timeout.
    name: independent-review-rerun
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Two comments close together would both find the run completed, and the second re-run
    # would fail on the run the first one restarted. One job per pull request runs at a
    # time; the next waits for it, and then for the run it restarted.
    concurrency:
      group: independent-review-rerun-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Re-run the guard on the head commit
        run: |
          head="$(gh api "repos/$REPOSITORY/pulls/$NUMBER" --jq .head.sha)"
          run="$(gh run list --repo "$REPOSITORY" --workflow guards.yml --commit "$head" \
            --event pull_request_target --limit 1 --json databaseId --jq '.[0].databaseId')"
          if [ -z "$run" ]; then
            echo "::error::no guards run of pull_request_target for $head"
            exit 1
          fi
          deadline=$((SECONDS + WAIT_SECONDS))
          status="$(gh run view "$run" --repo "$REPOSITORY" --json status --jq .status)"
          while [ "$status" != "completed" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::run $run is still $status after $WAIT_SECONDS seconds"
              exit 1
            fi
            echo "run $run is $status; waiting"
            sleep 15
            status="$(gh run view "$run" --repo "$REPOSITORY" --json status --jq .status)"
          done
          job="$(gh run view "$run" --repo "$REPOSITORY" --json jobs \
            --jq '.jobs[] | select(.name == "independent-review") | .databaseId')"
          if [ -z "$job" ]; then
            echo "::error::run $run has no independent-review job"
            exit 1
          fi
          gh run rerun "$run" --repo "$REPOSITORY" --job "$job"
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          WAIT_SECONDS: 1500

  deny-rules:
    # The guard compares the settings file of the base and head commits with `git`, so the
    # head's objects are fetched into the base checkout as data; nothing from them is
    # checked out, built or run.
    name: deny-rules
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - name: Check out the head commit as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false
      - name: Fetch the head commit into the base checkout
        # A local fetch, which needs no credentials; it adds objects and changes no file.
        run: git -C base fetch --no-tags --quiet ../head HEAD
      - name: Install the toolchain of the base commit
        working-directory: base
        run: rustup toolchain install
      - name: Run the guard
        working-directory: base
        run: cargo xtask deny-rules
