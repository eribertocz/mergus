[package]
name = "mergus-ports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "I/O traits and their real implementations."

[features]
default = []
# MG-REQ-0133: the real implementations compile only with this feature.
real = ["dep:duckdb", "dep:keyring"]

[dependencies]
# MG-REQ-0194: the `Database` port reads and writes Arrow record batches. Only the array and
# schema types are needed, so default features stay off; the version is the one `duckdb` uses.
arrow = { version = "60.2.0", default-features = false }
# MG-REQ-0193 and MG-REQ-0194: the real `SqlParser` and `Database`. Only under the feature
# `real` (MG-REQ-0133); only this crate may depend on `duckdb` (MG-REQ-0194). DuckDB v2.0.1,
# which supports DuckLake. `appender-arrow` appends Arrow record batches.
duckdb = { version = "=1.20001.0", default-features = false, features = ["bundled", "json", "appender-arrow"], optional = true }
# MG-REQ-1001.2: the real `Keychain`. Only under the feature `real` (MG-REQ-0133); only this
# crate may depend on `keyring` (MG-REQ-0126.7). Keychain Services on macOS, Credential Manager
# on Windows, and the Secret Service elsewhere through `dbus`, with libdbus built from source
# (`vendored`) and pure-Rust cryptography (`crypto-rust`), so no system library is needed.
# Version 3: the Secret Service of version 4 goes through `zbus` 5, whose `zvariant` and
# `zbus_names` are unmaintained (RUSTSEC-2026-0370 to 0372).
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"], optional = true }
thiserror = "2.0.21"

[lints]
workspace = true

# The tests of the real implementations need the feature `real`. Dev-dependencies are not
# linked into other crates, so this does not enable it anywhere else (MG-REQ-0126.5).
[dev-dependencies]
mergus-ports = { path = ".", features = ["real"] }
serde_json = "1.0.154"
