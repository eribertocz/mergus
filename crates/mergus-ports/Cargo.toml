[package]
name = "mergus-ports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "I/O traits and their real implementations."

[features]
default = []
# MG-REQ-0133: the real implementations compile only with this feature.
real = ["dep:duckdb"]

[dependencies]
thiserror = "2.0.21"
# MG-REQ-0193: the real `SqlParser`; DuckDB and its JSON extension are compiled in.
duckdb = { version = "=1.20001.0", default-features = false, features = ["bundled", "json"], optional = true }

[lints]
workspace = true

# The tests of the real implementations need the feature `real`. Dev-dependencies are not
# linked into other crates, so this does not enable it anywhere else (MG-REQ-0126.5).
[dev-dependencies]
mergus-ports = { path = ".", features = ["real"] }
