[package]
name = "mergus-ports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "I/O traits and their real implementations."

[features]
default = []
# MG-REQ-0133: the real implementations compile only with this feature.
real = ["dep:duckdb", "dep:keyring"]

[dependencies]
# MG-REQ-0193: the real `SqlParser`. Only under the feature `real` (MG-REQ-0133).
duckdb = { version = "=1.20001.0", default-features = false, features = ["bundled", "json"], optional = true }
# MG-REQ-1001.2: the real `Keychain`. Only under the feature `real` (MG-REQ-0133); only this
# crate may depend on `keyring` (MG-REQ-0126.7). Its feature `v1` uses Keychain
# Services, Credential Manager and the Secret Service through `zbus`, none of which needs a
# system library to build.
keyring = { version = "4.2.0", default-features = false, features = ["v1"], optional = true }
thiserror = "2.0.21"

[lints]
workspace = true

# The tests of the real implementations need the feature `real`. Dev-dependencies are not
# linked into other crates, so this does not enable it anywhere else (MG-REQ-0126.5).
[dev-dependencies]
mergus-ports = { path = ".", features = ["real"] }
serde_json = "1.0.154"
