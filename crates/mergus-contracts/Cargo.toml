[package]
name = "mergus-contracts"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Rust types generated from `schemas/`."

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[lints]
workspace = true

# The tests read the schemas and their examples through the real file system port.
# Dev-dependencies are not linked into other crates (MG-REQ-0126.5).
[dev-dependencies]
mergus-ports = { path = "../mergus-ports", features = ["real"] }
