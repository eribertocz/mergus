[package]
name = "mergus-project"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Read and validate the project: files, `project.toml`, folder `mergus.toml`."

[dependencies]
jsonschema = { version = "0.63.0", default-features = false }
mergus-contracts = { version = "0.1.0", path = "../mergus-contracts" }
mergus-ports = { path = "../mergus-ports" }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
thiserror = "2.0.21"
toml = { version = "=0.9.8", default-features = false, features = ["std", "parse", "serde"] }

[lints]
workspace = true

[dev-dependencies]
mergus-sim = { path = "../mergus-sim" }
