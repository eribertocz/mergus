[package]
name = "mergus-source"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Extract from databases (ADBC) and files."

[dependencies]
arrow = { version = "60.2.0", default-features = false }
mergus-ports = { path = "../mergus-ports" }
mergus-project = { path = "../mergus-project" }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
thiserror = "2.0.21"

[lints]
workspace = true

# The real `Database` checks that incremental values are written as DuckDB writes them.
[dev-dependencies]
mergus-ports = { path = "../mergus-ports", features = ["real"] }
mergus-sim = { path = "../mergus-sim" }
