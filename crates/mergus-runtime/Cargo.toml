[package]
name = "mergus-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Run cycle and scheduling; wires ports to crates."

[dependencies]
# Raw rows cross the adapter contract as Arrow record batches; the version of `mergus-adapter`.
arrow = { version = "60.2.0", default-features = false, features = ["ipc"] }
mergus-adapter = { path = "../mergus-adapter" }
mergus-adapter-ducklake = { path = "../mergus-adapter-ducklake" }
mergus-contracts = { path = "../mergus-contracts" }
mergus-engine-duckdb = { path = "../mergus-engine-duckdb" }
# The Polars steps of a `.py` model (MG-REQ-0617, MG-REQ-0704).
mergus-engine-polars = { path = "../mergus-engine-polars" }
mergus-plan = { path = "../mergus-plan" }
mergus-ports = { path = "../mergus-ports" }
mergus-project = { path = "../mergus-project" }
mergus-source = { path = "../mergus-source" }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
thiserror = "2.0.21"

[lints]
workspace = true

# The real `Database` runs the encryption test when its extensions are in the user cache.
[dev-dependencies]
mergus-ports = { path = "../mergus-ports", features = ["real"] }
mergus-sim = { path = "../mergus-sim" }
