[package]
name = "mergus-security"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Secret resolution, PII handling, hash chains."

[dependencies]
mergus-ports = { path = "../mergus-ports" }
mergus-project = { path = "../mergus-project" }
# MG-REQ-1002: resolved values are held in `SecretString`, which cannot be printed or
# serialized. The feature `serde` stays off.
secrecy = "0.10.3"
thiserror = "2.0.21"

[lints]
workspace = true

# The test of MG-REQ-0006 also runs a real `python3` when one is installed.
# Dev-dependencies are not linked into other crates (MG-REQ-0126.5).
[dev-dependencies]
mergus-ports = { path = "../mergus-ports", features = ["real"] }
mergus-sim = { path = "../mergus-sim" }
serde = "1.0.229"
